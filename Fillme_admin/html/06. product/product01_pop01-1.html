<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>영양제등록(팝업)01</title>
    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="../../script/jquery-3.6.0.js"></script>

<body>
    <button id="open" class="btn btn02">팝업열기</button>
    <div id="PopWrapper" class="popupOpen">
        <article id="popWrap" class="boxStyle width900">
            <div class="popArea">
                <div class="title">
                    <h1>영양제등록</h1>
                    <button id="close" class="closeBtn"><img src="../../image/close.svg" alt=""></button>
                </div>
                <!-- Input -->
                <div class="singInput cpStyle boxStyle03">
                    <div class="input_box type01">
                        <p>이름</p>
                        <div class="file-upload upload02">  
                            <img id="imagePreview" src="../../image/profile_img04.png" alt="프로필 이미지" class="show">
                            <input type="file" id="ex_filename" style="display:none;" accept="image/*">
                            <label for="ex_filename">업로드</label> 
                        </div>
                    </div>         
                    <div class="input_box type01">
                        <p>상품명</p>
                        <input type="text" placeholder="영양제 이름">
                    </div>                            
                    <div class="input_box type01">
                        <p>제조사</p>
                        <input type="text" placeholder="제조사 이름 입력하세요">
                    </div>    
                    <div class="input_box type01 ">
                        <p>성분/함량</p>
                        <input type="text" placeholder="성분 검색">
                    </div> 
                    <!-- 성분검색 -->
                    <div class="mediWrap">
                        <div class="medi">
                            <div class="mediBox">
                                <p>비타민B2</p>
                                <p>아미노산</p>
                                <p>오메가3</p>
                                <p>비타민A</p>
                                <p>비타민D</p>
                                <p>비타민B2</p>
                            </div>
                        </div>
                        <div class="medi">
                            <div class="input_box">
                                <div class="inflex">
                                    <input type="text" placeholder="함량 입력" class="">
                                    <span>mg</span>
                                </div>
                                <div class="inflex">
                                    <input type="text" placeholder="영양성분 기준치" class="">
                                    <span>%</span>
                                </div>
                                <button class="btn btn01" id="Btn_type"> 성분 등록</button>
                            </div>
                        </div>
                        <div class="medi">
                            <div class="mediBox02">
                                <h5 class="conTitle">등록 성분/함량/영양선분 기준치</h5>
                                <div class="mediBox">
                                    <div class="flex">
                                        <p>#비타민B2</p>
                                        <p>100mg</p>
                                        <p>10%</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="input_box type01 ">
                        <p>기타 주의사항</p>
                        <input type="text" placeholder="성분 검색">
                    </div>

                    <div class="YNwrap">
                        <div class="YNflex">
                            <h5 class="conTitle">고혈압 환자 복용 가능 여부</h5>
                            <h5 class="flex">
                                <span>Yes</span><span>/</span><span>No</span>
                            </h5>
                        </div>
                        <div class="YNflex">
                            <h5 class="conTitle">당뇨 환자 복용 가능 여부</h5>
                            <h5 class="flex">
                                <span>Yes</span><span>/</span><span>No</span>
                            </h5>
                        </div>
                        <div class="YNflex">
                            <h5 class="conTitle">고지혈증 환자 복용 가능 여부</h5>
                            <h5 class="flex">
                                <span>Yes</span><span>/</span><span>No</span>
                            </h5>
                        </div>
                        <div class="YNflex">
                            <h5 class="conTitle">갑상선 환자 복용 가능 여부</h5>
                            <h5 class="flex">
                                <span>Yes</span><span>/</span><span>No</span>
                            </h5>
                        </div>
                    </div>
                    <div class="input_box type01">
                        <p>섭취 방법(1일)</p>
                        <div class="flex01">
                            <input type="text" placeholder="오전/오후/상관없음" class="">
                            <input type="text" placeholder="1,2,3 회" class="mx20">
                            <input type="text" placeholder="식전/식후/상관없음" class="">
                        </div>
                    </div> 
                    <div class="input_box type01 ">
                        <p>참고 사이트 링크 <small class="bs_gray">(선택)</small></p>
                        <input type="text" placeholder="URL 주소를 입력해 주세요">                        
                    </div>
                    <div class="dotList org">
                        <li>원활하고 빠른 승인에 도움이 됩니다.</li>
                    </div>
                </div>
                <div class="btnFlex style05">
                    <button class="btn btn05_2">목록</button>
                    <button class="btn btn01" id="close">등록하기</button>
                </div>
            </div>
        </article>
    </div>
</body>
<script defer type="text/javascript" src="../../script/popup.js"></script>
<script defer type="text/javascript"  src="../../script/common.js"></script>
<script>
    document.getElementById('ex_filename').addEventListener('change', function(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const imagePreview = document.getElementById('imagePreview');
            imagePreview.src = e.target.result;
            imagePreview.style.display = 'block'; // 이미지 보이기
        };
        reader.readAsDataURL(file);
    }
});
</script>
</html>
