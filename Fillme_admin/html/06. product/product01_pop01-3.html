<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>영양제등록_확인 팝업</title>
    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="../../css/style.css" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <script src="../../script/jquery-3.6.0.js"></script>
</head>

<body>
    <button class="btn btn02" id="open">팝업열기</button>
    <div id="PopWrapper" class="popupOpen">
        <article id="popWrap" class="small border10">
            <div class="popArea style01">
                <div id="popSection" class="p_boardWrap">
                    <div class="group">
                        <h3 class="subtitle">
                            신규 영양제를 등록하셨습니다.
                        </h3>
                        <div class="textArea">
                            관리자 승인 후 영양제 리스트에서 확인 하실 수 있습니다. <br>조금만 기다려주세요!
                        </div>
                    </div>
                </div>
                <button class="Popclose mc" id="close">확인</button>
            </div>
        </article>
    </div>
</body>
<script defer type="text/javascript" src="../../script/popup.js"></script>
<script defer type="text/javascript" src="../../script/common.js"></script>

</html>
