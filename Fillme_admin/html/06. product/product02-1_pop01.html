<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>성분등록하기(팝업)01</title>
    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="../../script/jquery-3.6.0.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

<body>
    <button id="open" class="btn btn02">팝업열기</button>
    <div id="PopWrapper" class="popupOpen">
        <article id="popWrap" class="boxStyle type01">
            <div class="popArea">
                <div class="title">
                    <h1>성분등록</h1>
                    <button id="close" class="closeBtn"><img src="../../image/close.svg" alt=""></button>
                </div>
                <!-- Input -->
                <div class="singInput cpStyle boxStyle03" id="inputSize">
                    <div class="input_box type01">
                        <p>타입</p>
                        <button class="btn btn01_2 color_m" id="Btn_type">영양소 / 기능성원료 선택</button>
                    </div>         
                    <div class="input_box type01">
                        <p>성분명</p>
                        <input type="text" placeholder="성분명을 입력하세요">
                    </div>                            
                    <div class="input_box type01">
                        <p>효능</p>
                        <input type="text" placeholder="효능을 입력하세요">
                    </div>    
                    <div class="input_box type01">
                        <p>섭취시 주의사항</p>
                        <input type="text" placeholder="섭취시 주의사항을 입력하세요">
                    </div>  
                    <div class="input_box type01">
                        <p>1일 영양성분 기준치</p>
                        <div class="flex">
                            <input type="text" placeholder="기준치를 입력하세요" class="wd100">
                            <button class="btn btn01" id="Btn_type02">선택</button>
                        </div>  
                    </div> 
                </div>

                <div class="btnFlex style04">
                    <button class="btn btn05_2">취소</button>
                    <button class="btn btn01" id="close">등록하기</button>
                </div>
            </div>
        </article>
    </div>
</body>
<script defer type="text/javascript" src="../../script/popup.js"></script>
<script defer type="text/javascript"  src="../../script/common.js"></script>


</html>
