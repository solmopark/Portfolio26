    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>소분완료(팝업)</title>

<body>
    <button class="btn btn02" id="open">팝업열기</button>

                        <img src="../../image/popup_img01.png" alt="" >
                        <!-- <div class="textArea"></div> -->
                    </div>
                </div>
                <div id="miniPop">
                    <button class="Popclose" id="">취소</button>
                    <button class="Popclose mc" id="close">소분완료</button>
                </div>                
            </div>
        </article>
    </div>
