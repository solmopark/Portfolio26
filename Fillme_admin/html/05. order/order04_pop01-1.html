<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>배송정보 입력</title>
    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/4.1.6/css/swiper.css" />
    <script src="../../script/jquery-3.6.0.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/4.1.6/js/swiper.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
</head>

<body>
    <button class="btn btn02" id="open">팝업열기</button>
    <div id="PopWrapper" class="popupOpen">
        <article id="popWrap" class="boxStyle width500">
            <div class="popArea">
                <div class="title borderStyle04">
                    <h1>배송정보 입력</h1>
                    <button id="close" class="closeBtn"><img src="../../image/close.svg" alt=""></button>
                </div>
                <div class="popcon type01">
                    <h5 class="gray">배송정보를 입력해주세요.</h5>
                    
                    <div class="input_box">
                        <p>택배사</p>
                        <input onfocus="$(this).addClass('focused')" class="input-with-message" type="text"
                            placeholder="택배사 이름">                        
                    </div>
                    <div class="input_box">
                        <p>송장번호</p>
                        <input onfocus="$(this).addClass('focused')" class="input-with-message" type="text"
                            placeholder="송장번호를 입력해주세요.(10~14자리)">
                    </div>
                </div>

                <div class="btnFlex">
                    <button class="btn btn05_2">취소</button>
                    <button class="btn btn01" id="close">등록하기</button>
                </div>
            </div>
        </article>
    </div>
</body>
<script defer type="text/javascript" src="../../script/popup.js"></script>
<script defer type="text/javascript" src="../../script/common.js"></script>


</html>
