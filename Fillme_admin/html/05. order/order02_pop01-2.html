<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>소분완료_확인(팝업)</title>
    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="../../css/style.css" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />

<body>
    <button class="btn btn02" id="open">팝업열기</button>
    <div id="PopWrapper" class="popupOpen">
        <article id="popWrap" class="small border10">
            <div class="popArea style01">
                <div id="popSection" class="p_boardWrap">
                    <div class="group">
                        <h3 class="subtitle ">
                            약사님 수고하셨습니다! <br>
                            이제 고객님들께 배송을 해주세요!
                        </h3>
                        <div class="textArea">
                            배송 후 송장번호를 주문관리에서 꼭 입력해주세요!
                        </div>
                    </div>
                </div>
                <button class="Popclose mc" id="close">확인</button>              
            </div>
        </article>
    </div>
</body>
<script defer type="text/javascript" src="../../script/popup.js"></script>
<script defer type="text/javascript" src="../../script/common.js"></script>
