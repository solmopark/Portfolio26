<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공지사항 등록하기(팝업)01</title>
    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="../../script/jquery-3.6.0.js"></script>

<body>
    <button id="open" class="btn btn02">팝업열기</button>
    <div id="PopWrapper" class="popupOpen">
        <article id="popWrap" class="boxStyle type01">
            <div class="popArea">
                <div class="title borderStyle01">
                    <h1>공지사항 등록하기</h1>
                    <button id="close" class="closeBtn"><img src="../../image/close.svg" alt=""></button>
                </div>
                <!-- Input -->
                <div class="singInput cpStyle">             
                    <div class="input_box type01">
                        <p>제목</p>
                        <input type="text" class="wd100 black">
                    </div>
                    <div class="input_box type02">
                        <p>질문</p>
                        <div class="editInput">
                            <div id="editor">
                                <p><br><br><br><br><br><br></p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="btnFlex style05">
                    <button class="btn btn01" id="close">저장</button>
                    <button class="btn btn05_2">목록</button>
                </div>
            </div>
        </article>
    </div>
</body>
<script defer type="text/javascript" src="../../script/popup.js"></script>
<script defer type="text/javascript"  src="../../script/common.js"></script>
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
// TextEditor
let quill = new Quill('#editor', {
    theme: 'snow'
});
</script>
</html>
