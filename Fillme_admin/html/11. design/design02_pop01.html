<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>팝업 등록(팝업)01</title>
    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="../../script/jquery-3.6.0.js"></script>

<body>
    <button id="open" class="btn btn02">팝업열기</button>
    <div id="PopWrapper" class="popupOpen">
        <article id="popWrap" class="boxStyle middle">
            <div class="popArea">
                <div class="title borderStyle01">
                    <h1>팝업 등록</h1>
                    <button id="close" class="closeBtn"><img src="../../image/close.svg" alt=""></button>
                </div>
                <!-- Input -->
                <div class="singInput cpStyle">
                    <div class="input_box type01">
                        <p class="wd11">코드</p>
                        <input type="text" placeholder="사용자배너 n" class="wd25">
                    </div>   
                    <div class="input_box type02">
                        <p>기간</p>
                        <div class="cpFlex">
                            <div class="Check">
                                <input type="checkbox" checked="">
                                <span>무제한</span>
                            </div>
                            <div class="dayInput flex">
                                <div class="date_input">
                                    <input type="date" class="date" title="날짜입력" value="2024-01-01" id='currentDate'>
                                </div>
                                <span class="custom-form-space">부터</span>
                                <div class="date_input">
                                    <input type="date" class="date" title="날짜입력" value="2024-01-01" id='currentDate'>
                                </div>
                                <span class="custom-form-space">까지</span>
                            </div>
                        </div>
                    </div>
                    <div class="input_box type01">
                        <p class="wd18">팝업크기</p>
                        <div class="inflex">
                            <input type="text" placeholder="가로">
                            <span class="textArea"> X</span>
                            <input type="text" placeholder="세로">
                        </div>
                        <p>팝업위치</p>
                        <div class="selectBox">
                            <select name="select" class="select">
                                <option value="가운데">가운데</option>
                                <option value="상단">상단</option>
                                <option value="하단">하단</option>
                            </select>
                        </div>
                    </div>
                    <div class="input_box type01">
                        <p>대상기기</p>
                        <div class="cpFlex">
                            <div class="inandck">
                                <div class="Check">
                                    <input type="checkbox">
                                    <span>데스크톱</span>
                                </div>
                                <div class="Check">
                                    <input type="checkbox">
                                    <span>모바일</span>
                                </div>
                            </div>                            
                        </div>
                    </div>                              
                    <div class="incheck02">
                        <div class="categoryWrap">
                            <h3>노출</h3>
                            <div class="category">
                                <div class="radioFlex">
                                    <label class="cate">
                                        <input type="radio" name="styles" id="radioC" checked>
                                        <div>홈 화면</div>
                                    </label>
                                    <label class="cate">
                                        <input type="radio" name="styles" id="radioC">
                                        <div>사용자 정의</div>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="categoryWrap">
                            <h3>적용 조건</h3>
                            <div class="category">
                                <div class="radioFlex">
                                    <label class="cate">
                                        <input type="radio" name="styles" id="radioC"  checked>
                                        <div>모든 방문자</div>
                                    </label>
                                    <label class="cate">
                                        <input type="radio" name="styles" id="radioC">
                                        <div>로그인 방문자</div>
                                    </label>
                                </div>
                            </div>
                        </div>
                    
                        <div class="categoryWrap">
                            <h3>버튼 설정</h3>
                            <div class="category">
                                <div class="radioFlex">
                                    <label class="cate">
                                        <input type="radio" name="styles" id="radioC" checked>
                                        <div>배너 하단 버튼 표시</div>
                                    </label>
                                    <label class="cate">
                                        <input type="radio" name="styles" id="radioC">
                                        <div>표시안함</div>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="categoryWrap">
                            <h3>닫기 설정</h3>
                            <div class="category">
                                <div class="radioFlex">
                                    <label class="cate">
                                        <input type="radio" name="styles" id="radioC" checked>
                                        <div>닫기</div>
                                    </label>
                                    <label class="cate">
                                        <input type="radio" name="styles" id="radioC">
                                        <div>오늘 하루 다시 보지 않기</div>
                                    </label>
                                    <label class="cate">
                                        <input type="radio" name="styles" id="radioC">
                                        <div>표시안함</div>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="singInput cpStyle">                    
                    <div class="input_box type01">
                        <p>제목</p>
                        <input type="text" class="wd100">
                    </div>
                    <div class="input_box type02">
                        <p>내용</p>
                        <div class="editInput">
                            <div id="editor">
                                <p><br><br><br></p>
                            </div>
                        </div>
                    </div>
                    <div class="input_box type01">
                        <p>이미지링크</p>
                        <div class="inflex">
                            <input type="text" value="http://" class="wd40">
                            <div class="Check">
                                <input type="checkbox" checked="">
                                <span>새 창에서 열기</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="btnFlex style05">
                    <button class="btn btn01" id="close">저장</button>
                    <button class="btn btn05_2">목록</button>
                </div>
            </div>
        </article>
    </div>
</body>
<script defer type="text/javascript" src="../../script/popup.js"></script>
<script defer type="text/javascript"  src="../../script/common.js"></script>
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
// TextEditor
let quill = new Quill('#editor', {
    theme: 'snow'
});
    document.getElementById('radioC').checked = false;
</script>
</html>
