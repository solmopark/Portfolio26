<body>

                    </div>

                            </div>
                            <span class="p_yagsa_T">필미약국</span>

                                안녕하세요, 오필미필미필미님 <br>

                                감사합니다.
                            </p>
                        </div>
                        <span class="numtext bs_gray">1시간 전</span>
                    </div>
                    <div class="group">
                        <h3 class="subtitle">유의사항</h3>

                                <br>
                            </li>
                        </ul>
                    </div>
                </div>

                <button class="Popclose" id="close">닫기</button>
