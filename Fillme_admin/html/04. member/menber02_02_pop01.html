<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>가입승인상태(팝업)01</title>
    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="../../css/style.css" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <script src="../../script/jquery-3.6.0.js"></script>
</head>
<body>
    <button class="btn btn02" id="open">팝업열기</button>
    <div id="PopWrapper" class="popupOpen">
        <article id="popWrap" class="boxStyle small">
            <div class="popArea">
                <div class="title borderStyle01">
                    <h1>가입상태 변경하기</h1>
                    <button id="close" class="closeBtn"><img src="../../image/close.svg" alt=""></button>
                </div>
            <div class="singInput">
                <div class="input_box type01">
                    <p>가입상태</p>
                    <div class="selectBox " style="width:80%;">
                        <select name="select" class="select">
                            <option value="승인대기">승인대기</option>
                            <option value="승인완료">승인완료</option>
                            <option value="가입거절">가입거절</option>
                        </select>
                    </div>
                </div>
                
            </div>
            <div class="btnFlex">
                <button class="btn btn05_2">취소</button>
                <button class="btn btn01" id="close">등록</button>
            </div>
        </article>
    </div>
</body>
<script defer type="text/javascript" src="../../script/popup.js"></script>
<script defer type="text/javascript" src="../../script/common.js"></script>

</html>
