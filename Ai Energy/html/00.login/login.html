<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI 에너지 분석 시스템">
    <meta name="keywords" content="AI 에너지 분석 시스템">
    <meta property="og:title" content="AI 에너지 분석 시스템" />
    <meta property="og:description" content="AI 에너지 분석 시스템" />
    <!-- <meta property="og:image" content="../../image/" />
    <meta property="og:url" content="https://" />
    <meta name="google-site-verification" content="..." /> -->
    <title>AI 에너지 분석 시스템_login</title>

    <script defer type="text/javascript" src="../../script/common.js"></script>
    <script src="../../script/jquery-3.6.0.js"></script>
    <link rel="stylesheet" href="../../css/stylemin.css" />    
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.4.0/remixicon.css">
    
</head>


<body>
    <!-- content -->
    <main>
        <div id="Wrap" class="log">
            <div class="inner">
                <div class="container">
                    <div class="logWrap">
                        <h1>AI 에너지 분석 시스템</h1>
                        <div class="logInput">
                            <div class="input_box">
                                <!-- <p>이메일</p> -->
                                <input onfocus="$(this).addClass('focused')" class="input-with-message" type="email" placeholder="Email">
                                <span class="input-status-message input-status-message--empty">
                                    이메일 형식이 올바르지 않습니다.
                                </span>
                            </div>
                            <div class="input_box">
                                <div class="password-container">
                                    <input id="password" onfocus="$(this).addClass('focused')" class="input-with-message" type="password" placeholder="Password">
                                        <span class="input-status-message input-status-message--empty">
                                            8~32자리 영문 대소문자, 숫자, 특수문자를 조합하여 <br>입력해 주세요.
                                        </span>
                                    <div class="eyes"><i class="fa-regular fa-eye"></i></div>
                                </div>
                            </div>
                            <button class="btn log">SIGN IN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
