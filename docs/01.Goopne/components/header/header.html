<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Header Component</title>
    <link rel="stylesheet" href="../../reset.css" />
    <link rel="stylesheet" href="../../common.css" />
    <link rel="stylesheet" href="./header.css" />
  </head>
  <body>
    <header class="main-header">
      <!-- 상단 바 (데스크톱용) -->
      <div class="top-bar">
        <div class="header-container">
          <div>
            <button class="active-tab">굽네치킨</button>
            <button>GN그룹</button>
          </div>
          <!-- <div class="auth">
            <a href="#"><img src="../../assets/img/login.svg" alt="" />로그인</a>
            <a href="#"><img src="../../assets/img/sign.svg" alt="" />회원가입</a>
          </div> -->
        </div>
      </div>

      <!-- 내비게이션 (데스크톱용) + 모바일 헤더 -->
      <nav class="nav-bar">
        <div class="header-container2">
          <!-- 로고 -->
          <h1 class="logo" onclick="location.href='UI-HOM-01-01.html'">
            <img src="../../assets/img/header-logo2.svg" alt="" />
          </h1>

          <!-- (데스크톱용) 메뉴 -->
          <ul class="nav-menu">
            <li><a href="/html/UI-NPR-01.html">신제품</a></li>
            <li><a href="/html/UI-MNU-01.html">제품소개</a></li>
            <li><a href="/html/UI-STR-01.html">매장찾기</a></li>
            <li><a href="#">주문하기</a></li>
            <li><a href="/html/UI-STU-01.html">창업안내</a></li>
          </ul>

          <!-- (모바일용) 햄버거 버튼 -->
          <button class="hamburger-btn" aria-label="메뉴 열기">
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
          </button>
        </div>
      </nav>
    </header>

    <script>
      // 모바일에서 메뉴 열고 닫는 로직 (선택)
      const hamburgerBtn = document.querySelector('.hamburger-btn');
      let isOpen = false;
      hamburgerBtn.addEventListener('click', () => {
        isOpen = !isOpen;
        if (isOpen) {
          hamburgerBtn.classList.add('active');
          // 실제 모바일 메뉴 열기 로직 추가 가능
        } else {
          hamburgerBtn.classList.remove('active');
          // 메뉴 닫기 로직
        }
      });
    </script>
  </body>
</html>
