<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>제품소개-상세</title>
    <link rel="stylesheet" href="../reset.css" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../components/header/header.css" />
    <link rel="stylesheet" href="../components/footer/footer.css" />
    <link rel="stylesheet" href="../css/UI-MNU-01-01.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script defer type="text/javascript" src="../js/UI-HOM-01-01.js"></script>
    <script defer type="text/javascript" src="../js/UI-MNU-01-01.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
    rel="stylesheet"/>
  </head>
  <body>
    <div class="main-container">
      <div id="header-container"></div>
      <div class="content-container">
        <div class="MNU-01-01-flex">
          <div class="imgArea">
            <img src="../assets/img/UI-MNU-01-01-img01.png" alt="">
          </div>
          <div class="right textbox">
            <div class="title-flex mb30">
              <h2 class="fs26">오리지널</h2>
              <span>
                <button class="label mr10 origin-info-btn">원산지 정보</button>
                <button class="label allergy-info-btn">영양성분, 알레르기</button>
              </span>
            </div>
            <p class="price mb20">17,900원 <i class="ri-question-fill"></i>
              <span class="mark-hover">
                <i class="ri-question-line"></i> <span>해당 가격은 권장 소비자가 입니다.</span>
              </span>
            </p>
            <div class="textArea mb40">
              굽네 오리지널 모르는 사람 없지? <br>기름기 쭉 뺀 야들야들 오븐구이 치킨의 원조!
            </div>

            
            <p class="price end mb40">17,900원 <i class="ri-question-fill"></i>
              <span class="mark-hover">
                <i class="ri-question-line"></i> <span>해당 가격은 권장 소비자가 입니다.</span>
              </span>
            </p>
            <button class="order-now">구매하러 가기</button>
          </div>
        </div>
      </div>
      <div id="footer-container"></div>
    </div>
     <!-- 원산지/영양성분 -->
    <div class="overlay origin-overlay">
      <div class="popup">
        <img src="../assets/img/popup_logo.svg" alt="">
        <h3><img src="../assets/img/UI-MNU-01-03-img01.png" alt=""></h3>
          <button class="close-btn">확인</button>
      </div>
    </div>

    <div class="overlay allergy-overlay">
      <div class="popup">
        <img src="../assets/img/popup_logo.svg" alt="">
        <h3><img src="../assets/img/UI-MNU-01-03-img02.png" alt=""></h3>
          <button class="close-btn">확인</button>
      </div>
    </div>
    
    <!-- 구매하러가기 팝업 -->
    <div class="overlay order-overlay">
      <div class="popup">
        <img src="../assets/img/popup_logo.svg" alt="">
        <h3>해당 가격은 매장 권장 가격으로 <br>
          실제 판매가와 다를 수 있습니다.</h3>
          <button class="close-btn">닫기</button>
      </div>
    </div>
  </body>  
</html>
